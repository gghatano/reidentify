name: R checks

# README の記載と実装のずれ (#47) と、パッケージ本体の健全性を自動で検出する。
#
# なぜパスフィルタを付けないか:
#   docs/verify-readme-examples.R は README.md / R/ / NAMESPACE の 3 者を突き合わせ、
#   R CMD check は tests/ / man/ / DESCRIPTION / data/ にも依存する。対象パスを
#   列挙すると、列挙し忘れた 1 つの変更で検査が静かに飛ぶ。実測で harness 21 秒 /
#   check 111 秒しかかからないので、全変更で回す方が安い。
#   (パスフィルタで実行されなかった workflow は required check として "pending" の
#   まま止まる、という GitHub の挙動を避ける意味もある。)
#
# なぜジョブを 2 つに分けるか:
#   最初は 1 ジョブに 2 つのステップとして書いたが、PR #53 (README を 1 行だけ
#   壊す negative test) で、先に R CMD check が落ちると README ハーネス側の
#   判定ステップが暗黙の success() 条件で skip され、**どちらが原因か判別
#   できなくなる**ことが分かった。独立した 2 ジョブなら、2 つの検査結果が
#   互いを隠さない。並列に走るので所要時間も伸びない。
#
# なぜ R CMD check だけをマトリクス化するか (#85):
#   #85 の指摘どおり、それまで全ジョブが ubuntu-latest / release の 1 環境
#   だけだった。#55 では「テスト 2009 件すべて成功」が Windows 限定で、Linux
#   では 2 件落ちていた (cat() の末尾空白を Windows の normalizePath() が
#   Win32 API 経由で除去していた)。いまは逆で、開発は Windows 上、検証は
#   Linux だけという構造になっている。
#
#   マトリクスに載せたのは R CMD check ジョブだけで、README examples と
#   source-tree tests は ubuntu-latest / release のままにした。理由は
#   **1 ジョブあたりのプラットフォーム情報量**で決めている:
#
#     - R CMD check は tests/testthat をそのまま走らせる (実測 2453 件)。
#       vignette のビルドと examples の実行、--as-cran の各検査も通る。
#       プラットフォーム差が出るとしたらここに最も広く出る。
#     - source-tree tests が追加で通すのは 4 件 (2457 - 2453) だけで、
#       残りは R CMD check と同じテストである。実測 26 分かかった実績が
#       あり (#63 当時)、直近の master でも 4 分 44 秒。これを 5 環境に
#       広げても、増える情報は 4 件分にとどまる。
#     - README examples が照合するのは README.md の `#>` と NAMESPACE で、
#       どちらもプラットフォームに依存しない成果物である。
#
#   fail-fast: false にしてあるので、1 環境が落ちても他は最後まで走る。
#   #55 のような「1 プラットフォームだけ落ちる」事象は、他が中断すると
#   どこまでが共通の問題か分からなくなる。
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# 同じ PR に続けて push したら、古い実行は捨てる。master は捨てない。
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # README の全コードブロックを 1 セッションで実行し、`#>` を順序込みで厳密比較
  # する。エクスポート関数の README 未記載も同時に検出する。差分があれば
  # ハーネスが非ゼロ終了し、このジョブが落ちる。
  readme-examples:
    runs-on: ubuntu-latest
    name: README examples

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          # RSPM の Linux バイナリを使う。philentropy は C++ を含むので、
          # ソースビルドだと毎回数分持っていかれる。
          use-public-rspm: true

      # DESCRIPTION の Imports / Suggests を解決し、pak のキャッシュを
      # actions/cache に載せる。extra-packages は R CMD check ジョブと同じ
      # 並びにしてある — キャッシュキーが一致し、1 回のインストールを
      # 共有できる。キャッシュキーには OS と R のバージョンが入るので、
      # 共有できるのは R CMD check の ubuntu-latest / release の脚だけで、
      # windows / macos / 4.1 / devel はそれぞれ自前のキャッシュを持つ。
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgload, any::rcmdcheck
          needs: check

      - name: Verify README examples
        run: Rscript docs/verify-readme-examples.R .

      - name: How to fix
        if: failure()
        run: |
          echo "::error file=README.md::README の #> 出力が実際の出力と一致しないか、"\
               "エクスポート関数が README に載っていません。"\
               "上のステップのログの MISMATCH 節に、どのブロックのどの行がずれたかが出ています。"\
               "出力の再生成: Rscript docs/verify-readme-examples.R . --rewrite"

  # pkgload::load_all() + testthat::test_dir() で作業ツリーそのものを検査する。
  # R CMD check はビルド済み tarball を一時ライブラリへ入れて検査するので、
  # ソースツリーが見えることを前提にしたテストは別の分岐を通る。2 つの経路は
  # 通る本数が違う (実測 2225 / 2227) ので、どちらにも価値がある。
  # site/index.html が載せている「自動テスト N 件」はこちらの完全な方の数字で、
  # 同じジョブで照合する (#63)。
  source-tree-tests:
    runs-on: ubuntu-latest
    name: source-tree tests

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgload, any::rcmdcheck
          needs: check

      - name: Run the suite against the working tree
        run: Rscript docs/run-source-tests.R . --check-figures

  R-CMD-check:
    runs-on: ${{ matrix.config.os }}
    name: R CMD check (${{ matrix.config.os }} / R ${{ matrix.config.r }})

    strategy:
      # 1 環境の失敗で他を打ち切らない (#85)。落ちた環境がどれかではなく、
      # 「どの環境で落ちてどの環境で通ったか」が知りたい情報である。
      fail-fast: false
      matrix:
        config:
          # 現行の基準線。ここが落ちたらプラットフォーム固有ではない。
          - { os: ubuntu-latest,  r: 'release' }
          # 開発環境。#55 と同型 (プラットフォーム依存の暗黙の挙動) の再発検出。
          - { os: windows-latest, r: 'release' }
          # 3 つ目の OS。ファイルシステムと locale の既定が Linux/Windows の
          # どちらとも違うので、両者に共通の前提が紛れていれば出る。
          - { os: macos-latest,   r: 'release' }
          # DESCRIPTION の `Depends: R (>= 4.1.0)` は #77 で dplyr 1.2.1 の
          # 要求を継承して書いた数字で、実際に 4.1 で動くかは一度も試されて
          # いない。宣言を検証するのはこのジョブである。
          - { os: ubuntu-latest,  r: '4.1' }
          # 将来の R での破壊を早期に検知する。http-user-agent: release は
          # r-lib/actions の標準レシピで、P3M に release 向けの Linux
          # バイナリを返させて devel のソースビルドを避けるためのもの。
          - { os: ubuntu-latest,  r: 'devel', http-user-agent: 'release' }

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      # "checking for future file timestamps" は外部の時刻 API に問い合わせる。
      # 到達できないと "unable to verify current time" という NOTE になり、
      # error-on: note と組み合わせるとパッケージと無関係にジョブが落ちる。
      # 検査したいのはパッケージであってランナーの疎通ではないので無効化する。
      _R_CHECK_SYSTEM_CLOCK_: false

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      # vignette (rmarkdown::html_vignette) のビルドに pandoc が要る (#75)。
      # ubuntu-latest のイメージには元から入っているが、それは
      # "checking top-level files" が README.md を読むための偶然の前提だった。
      # vignette が入った以上、無いとビルドそのものが落ちるので明示する。
      # マトリクス化で windows / macos も回るようになり、ランナーイメージに
      # 何が入っているかを当てにできなくなったので、なおさら明示が要る。
      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgload, any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          # --as-cran を付ける (#67)。以前のコメントは「tests/ が pkgload を
          # 使っているが Suggests に無いため WARNING になる」と書いていたが、
          # pkgload は 48e2f82 で Suggests に入っており、その理由はもう無い。
          # 実測 (R 4.6.1): --as-cran --no-manual で Status: OK。
          args: 'c("--no-manual", "--as-cran")'
          # vignette をビルドさせる (#75)。この入力の既定は
          # c("--no-manual", "--no-build-vignettes") で、vignettes/ に .Rmd が
          # あるのに inst/doc が空の tarball ができる。実測 (R 4.6.1,
          # --as-cran): 既定のままだと WARNING 2 件で落ちる --
          #   "Files in the 'vignettes' directory but no files in 'inst/doc'"
          #   "Package vignette without corresponding single PDF/HTML"
          # --no-build-vignettes を外すと Status: OK。
          # (--no-build-vignettes でも "re-building of vignette outputs" は
          #  走るのでコードは実行される。落ちるのは成果物が無いことの方。)
          build_args: 'c("--no-manual")'
          # NOTE でも落とす (#67)。リポジトリが掲げ、site/index.html が
          # 「エラー・警告・注意ともに 0」と書いている基準は NOTE 0 である。
          # "warning" のままでは、掲げた基準を CI が強制していない状態になる。
          # 宣言と実装を一致させる方を選んだ。基準を緩めるより、NOTE が出たら
          # その場で見る方が安い (現状 NOTE は 0 件)。
          error-on: '"note"'
          upload-snapshots: true
