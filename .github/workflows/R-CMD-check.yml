name: R checks

# README の記載と実装のずれ (#47) と、パッケージ本体の健全性を自動で検出する。
#
# なぜパスフィルタを付けないか:
#   docs/verify-readme-examples.R は README.md / R/ / NAMESPACE の 3 者を突き合わせ、
#   R CMD check は tests/ / man/ / DESCRIPTION / data/ にも依存する。対象パスを
#   列挙すると、列挙し忘れた 1 つの変更で検査が静かに飛ぶ。実測で harness 21 秒 /
#   check 111 秒しかかからないので、全変更で回す方が安い。
#   (パスフィルタで実行されなかった workflow は required check として "pending" の
#   まま止まる、という GitHub の挙動を避ける意味もある。)
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# 同じ PR に続けて push したら、古い実行は捨てる。master は捨てない。
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    name: README harness + R CMD check

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          # RSPM の Linux バイナリを使う。philentropy は C++ を含むので、
          # ソースビルドだと毎回数分持っていかれる。
          use-public-rspm: true

      # DESCRIPTION の Imports / Suggests を解決し、pak のキャッシュを
      # actions/cache に載せる (依存が変わらない限り再インストールしない)。
      # pkgload  : docs/verify-readme-examples.R が load_all() で使う
      # rcmdcheck: check-r-package が使う
      - name: Install dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgload, any::rcmdcheck
          needs: check

      # README の全コードブロックを 1 セッションで実行し、`#>` を順序込みで
      # 厳密比較する。差分があれば非ゼロ終了する。エクスポート関数の
      # README 未記載も同時に検出する。
      # 失敗しても次の R CMD check の結果は見たいので continue-on-error にし、
      # 最後にまとめて落とす。
      - name: Verify README examples
        id: readme
        continue-on-error: true
        run: Rscript docs/verify-readme-examples.R .

      - name: R CMD check
        uses: r-lib/actions/check-r-package@v2
        with:
          # --as-cran は付けない。tests/ が pkgload を使っているが DESCRIPTION の
          # Suggests に無いため "'::' or ':::' import not declared from: 'pkgload'"
          # で WARNING になる (ローカルで確認済み)。リポジトリがこれまで通して
          # きた基準は --no-manual なので、それに揃える。
          args: 'c("--no-manual")'
          error-on: '"warning"'
          upload-snapshots: true

      # README ハーネスが落ちていたら、R CMD check が通っていてもジョブを失敗させる。
      - name: Fail if the README harness failed
        if: steps.readme.outcome == 'failure'
        run: |
          echo "::error file=README.md::README の #> 出力が実際の出力と一致しません。" \
               "上の 'Verify README examples' ステップのログに、どのブロックのどの行が" \
               "ずれたかが MISMATCH として出ています。" \
               "ローカルでの再生成: Rscript docs/verify-readme-examples.R . --rewrite"
          exit 1
